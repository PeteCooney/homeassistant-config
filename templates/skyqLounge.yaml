- switch:
    - default_entity_id: switch.skyq_pauselounge
      name: "pause in the Lounge"
      state: "{{ 'off' }}"
      turn_on:
        - action: media_player.media_pause
          target:
            entity_id: media_player.lounge_sky_q
        - delay: "00:00:10"
      turn_off:
        - stop: ""
    - default_entity_id: switch.skyq_playlounge
      name: "play in the Lounge"
      state: "{{ 'off' }}"
      turn_on:
        - action: media_player.media_play
          target:
            entity_id: media_player.lounge_sky_q
        - delay: "00:00:10"
      turn_off:
        - stop: ""
    - default_entity_id: switch.skyq_fflounge
      name: "fastforward in the Lounge"
      state: "{{ 'off' }}"
      turn_on:
